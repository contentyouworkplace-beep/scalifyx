<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ad 5 — The Direct Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    background: #0A0A0F;
    font-family: 'Inter', sans-serif;
    overflow: hidden; position: relative;
  }

  /* Purple gradient top-left bloom */
  .bloom-tl {
    position: absolute; top: -120px; left: -120px;
    width: 600px; height: 600px;
    background: radial-gradient(ellipse, rgba(124,58,237,0.18) 0%, transparent 65%);
    pointer-events: none;
  }
  /* Subtle bottom-right bloom */
  .bloom-br {
    position: absolute; bottom: -80px; right: -80px;
    width: 400px; height: 400px;
    background: radial-gradient(ellipse, rgba(168,85,247,0.10) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Diagonal stripe texture */
  .stripes {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 40px,
      rgba(124,58,237,0.015) 40px,
      rgba(124,58,237,0.015) 41px
    );
    pointer-events: none;
  }

  .wrap {
    position: relative; z-index: 2;
    width: 1080px; height: 1350px;
    display: flex; flex-direction: column;
    padding: 72px 88px 64px;
  }

  /* Top row */
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 64px;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
  .brand span {
    color: #A855F7;
  }
  .tag {
    font-size: 18px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(168,85,247,0.6);
    border: 1px solid rgba(168,85,247,0.2);
    background: rgba(168,85,247,0.07);
    padding: 7px 18px; border-radius: 100px;
  }

  /* Search bar SVG visual */
  .visual { margin-bottom: 52px; }

  /* Big headline */
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 118px; line-height: 0.88;
    font-weight: 900; letter-spacing: -0.01em;
    text-transform: uppercase; color: #fff;
    margin-bottom: 36px;
  }
  h1 .line2 { color: rgba(255,255,255,0.15); }
  h1 .accent {
    color: transparent;
    -webkit-text-stroke: 2px #A855F7;
  }

  .sub {
    font-size: 28px; font-weight: 400;
    color: rgba(255,255,255,0.38);
    line-height: 1.65; max-width: 600px;
    margin-bottom: auto;
  }
  .sub strong { color: rgba(255,255,255,0.75); font-weight: 600; }

  /* Bottom action row */
  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 40px;
    border-top: 1px solid rgba(168,85,247,0.1);
  }
  .cta {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 44px;
    background: linear-gradient(135deg, #7C3AED, #A855F7);
    border-radius: 100px; color: #fff;
    font-weight: 700; font-size: 24px;
    box-shadow: 0 0 40px rgba(124,58,237,0.3);
  }
  .url-pill {
    font-size: 21px; font-weight: 600;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.04em;
  }

  /* Number ticker */
  .ticker {
    display: flex; flex-direction: column; gap: 4px;
    align-items: flex-end;
  }
  .ticker-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 800;
    color: #A855F7; letter-spacing: 0.04em;
  }
  .ticker-label {
    font-size: 17px; font-weight: 600;
    color: rgba(255,255,255,0.2); letter-spacing: 0.14em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="bloom-tl"></div>
<div class="bloom-br"></div>
<div class="stripes"></div>

<div class="wrap">

  <div class="top-row">
    <div class="brand"><span>Scalify</span> Vadodara</div>
    <div class="tag">Direct Challenge</div>
  </div>

  <!-- Search bar with results SVG -->
  <div class="visual">
    <svg width="904" height="148" viewBox="0 0 904 148" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Search bar -->
      <rect x="0" y="0" width="904" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Google G -->
      <circle cx="32" cy="26" r="12" fill="rgba(255,255,255,0.06)"/>
      <text x="32" y="31" font-family="Inter" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle" font-weight="700">G</text>
      <!-- Search text -->
      <text x="58" y="31" font-family="Inter" font-size="15" fill="rgba(255,255,255,0.5)" font-weight="500">best interior designer in Vadodara</text>
      <!-- Cursor blink -->
      <rect x="400" y="16" width="2" height="20" rx="1" fill="rgba(168,85,247,0.8)"/>
      <!-- Search icon right -->
      <circle cx="870" cy="26" r="12" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
      <circle cx="868" cy="24" r="5" stroke="rgba(168,85,247,0.8)" stroke-width="1.5" fill="none"/>
      <line x1="872" y1="28" x2="876" y2="32" stroke="rgba(168,85,247,0.8)" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Result 1 — competitor -->
      <rect x="0" y="64" width="430" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="83" r="6" fill="rgba(124,58,237,0.5)"/>
      <rect x="34" y="77" width="110" height="7" rx="3.5" fill="rgba(124,58,237,0.4)"/>
      <rect x="34" y="88" width="160" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="398" y="75" width="24" height="16" rx="4" fill="rgba(124,58,237,0.15)"/>
      <text x="410" y="87" font-family="Inter" font-size="9" fill="#A855F7" text-anchor="middle" font-weight="700">#1</text>

      <!-- Result 2 — competitor -->
      <rect x="0" y="108" width="430" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="127" r="6" fill="rgba(99,102,241,0.5)"/>
      <rect x="34" y="121" width="90" height="7" rx="3.5" fill="rgba(99,102,241,0.35)"/>
      <rect x="34" y="132" width="140" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="398" y="119" width="24" height="16" rx="4" fill="rgba(99,102,241,0.12)"/>
      <text x="410" y="131" font-family="Inter" font-size="9" fill="rgba(99,102,241,0.8)" text-anchor="middle" font-weight="700">#2</text>

      <!-- RIGHT: "Where are you?" panel -->
      <rect x="454" y="64" width="450" height="82" rx="10" fill="rgba(168,85,247,0.04)" stroke="rgba(168,85,247,0.15)" stroke-width="1" stroke-dasharray="8 5"/>
      <text x="679" y="98" font-family="Barlow Condensed" font-size="28" fill="rgba(168,85,247,0.35)" text-anchor="middle" font-weight="900" letter-spacing="2">WHERE ARE YOU?</text>
      <text x="679" y="124" font-family="Inter" font-size="13" fill="rgba(168,85,247,0.25)" text-anchor="middle" font-weight="500">Your customers don't see you here</text>
    </svg>
  </div>

  <h1>
    Search<br/>
    <span class="line2">your own</span><br/>
    <span class="accent">business.</span>
  </h1>

  <p class="sub">
    If you're not in the first results — your customers are going to whoever is.<br/>
    <strong>Fix it. One conversation. No fluff.</strong>
  </p>

  <div class="bottom-row">
    <div class="cta">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      DM us on WhatsApp
    </div>
    <div class="ticker">
      <div class="ticker-val">Month 2</div>
      <div class="ticker-label">First Results</div>
    </div>
    <div class="url-pill">scalifyapp.com/vadodara</div>
  </div>

</div>
</body>
</html>
