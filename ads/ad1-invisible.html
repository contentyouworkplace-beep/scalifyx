<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ad 1 — The Invisible Business</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    background: #04080F;
    font-family: 'Space Grotesk', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .wrap {
    width: 1080px; height: 1350px;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px;
  }

  /* Grid background */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Top glow */
  .glow {
    position: absolute; top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(0,180,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .tag {
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #00C8FF;
    border: 1px solid rgba(0,200,255,0.25);
    background: rgba(0,200,255,0.07);
    padding: 8px 20px; border-radius: 100px;
    margin-bottom: 48px;
  }

  /* Search result list SVG area */
  .visual { margin-bottom: 52px; position: relative; }

  .headline {
    font-size: 92px; font-weight: 800;
    line-height: 1.0; letter-spacing: -0.03em;
    color: #fff; text-align: center;
    margin-bottom: 28px;
  }
  .headline .dim { color: rgba(255,255,255,0.2); }
  .headline .accent { color: #00C8FF; }

  .sub {
    font-size: 30px; font-weight: 400;
    color: rgba(255,255,255,0.45);
    text-align: center; line-height: 1.6;
    max-width: 640px; margin-bottom: 60px;
  }
  .sub strong { color: rgba(255,255,255,0.85); font-weight: 600; }

  .cta {
    background: linear-gradient(135deg, #00C8FF, #0070FF);
    color: #000; font-weight: 800; font-size: 26px;
    padding: 20px 52px; border-radius: 100px;
    letter-spacing: 0.01em;
    box-shadow: 0 0 40px rgba(0,200,255,0.3);
  }

  .brand {
    position: absolute; bottom: 48px; left: 50%;
    transform: translateX(-50%);
    font-size: 22px; font-weight: 700;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .brand span { color: #00C8FF; }

  .corner-dot {
    position: absolute;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(0,200,255,0.4);
  }
  .corner-dot.tl { top: 40px; left: 40px; }
  .corner-dot.tr { top: 40px; right: 40px; }
  .corner-dot.bl { bottom: 40px; left: 40px; }
  .corner-dot.br { bottom: 40px; right: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="corner-dot tl"></div>
  <div class="corner-dot tr"></div>
  <div class="corner-dot bl"></div>
  <div class="corner-dot br"></div>

  <div class="tag">Vadodara · Local Business</div>

  <!-- SVG: Google search results, one slot empty/ghost -->
  <div class="visual">
    <svg width="580" height="200" viewBox="0 0 580 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Result 1 -->
      <rect x="0" y="0" width="580" height="52" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="26" cy="26" r="8" fill="#00C8FF" opacity="0.9"/>
      <rect x="46" y="14" width="160" height="10" rx="5" fill="rgba(0,200,255,0.7)"/>
      <rect x="46" y="30" width="260" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
      <rect x="530" y="18" width="36" height="16" rx="4" fill="rgba(0,200,255,0.15)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
      <text x="548" y="30" font-family="Space Grotesk" font-size="9" fill="#00C8FF" text-anchor="middle" font-weight="700">#1</text>

      <!-- Result 2 -->
      <rect x="0" y="62" width="580" height="52" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="26" cy="88" r="8" fill="#0070FF" opacity="0.8"/>
      <rect x="46" y="76" width="140" height="10" rx="5" fill="rgba(0,112,255,0.6)"/>
      <rect x="46" y="92" width="220" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
      <rect x="530" y="80" width="36" height="16" rx="4" fill="rgba(0,112,255,0.15)" stroke="rgba(0,112,255,0.3)" stroke-width="1"/>
      <text x="548" y="92" font-family="Space Grotesk" font-size="9" fill="#0070FF" text-anchor="middle" font-weight="700">#2</text>

      <!-- Result 3 — YOUR BUSINESS (ghost/empty) -->
      <rect x="0" y="124" width="580" height="52" rx="10" fill="rgba(255,50,50,0.03)" stroke="rgba(255,80,80,0.15)" stroke-width="1" stroke-dasharray="6 4"/>
      <circle cx="26" cy="150" r="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <text x="26" y="155" font-family="Space Grotesk" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">?</text>
      <rect x="46" y="138" width="120" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
      <rect x="46" y="154" width="180" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="400" y="154" font-family="Space Grotesk" font-size="13" fill="rgba(255,80,80,0.6)" font-weight="600">Your business?</text>

      <!-- Magnifying glass icon -->
      <g transform="translate(500, 20)">
        <circle cx="30" cy="30" r="20" stroke="rgba(0,200,255,0.2)" stroke-width="2" fill="none"/>
        <circle cx="30" cy="30" r="12" stroke="rgba(0,200,255,0.5)" stroke-width="2" fill="none"/>
        <line x1="39" y1="39" x2="50" y2="50" stroke="rgba(0,200,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <h1 class="headline">
    Someone searched.<br/>
    <span class="dim">Three results showed up.</span><br/>
    <span class="accent">You weren't one.</span>
  </h1>

  <p class="sub">
    We build websites & do SEO for local businesses in Vadodara.<br/>
    <strong>Results start from Month 2.</strong>
  </p>

  <div class="cta">scalifyapp.com/vadodara</div>

  <div class="brand"><span>Scalify</span> — Website & SEO · Vadodara</div>
</div>
</body>
</html>
