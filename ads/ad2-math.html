<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ad 2 — The Math</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Noise texture overlay */
  .noise {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.4; pointer-events: none;
  }

  /* Red diagonal slash accent */
  .slash {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-top: 340px solid #FF2D2D;
    border-left: 340px solid transparent;
  }
  .slash-text {
    position: absolute;
    top: 52px; right: 28px;
    font-family: 'Bebas Neue', cursive;
    font-size: 28px; letter-spacing: 0.12em;
    color: rgba(0,0,0,0.6);
    transform: rotate(0deg);
  }

  .wrap {
    position: relative; z-index: 2;
    width: 1080px; height: 1350px;
    display: flex; flex-direction: column;
    padding: 80px 80px 60px;
  }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 20px; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: #FF2D2D;
    margin-bottom: 60px;
  }
  .tag::before {
    content: '';
    display: block; width: 28px; height: 2px;
    background: #FF2D2D;
  }

  /* Bar chart */
  .chart-area {
    display: flex; align-items: flex-end; gap: 48px;
    margin-bottom: 52px; height: 220px;
  }
  .bar-group {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .bar-val {
    font-family: 'Bebas Neue', cursive;
    font-size: 52px; letter-spacing: 0.02em;
  }
  .bar-val.red { color: #FF2D2D; }
  .bar-val.dim { color: rgba(255,255,255,0.2); }
  .bar {
    width: 80px; border-radius: 6px 6px 0 0;
    position: relative; overflow: hidden;
  }
  .bar.competitor { height: 160px; background: linear-gradient(180deg, #FF2D2D, #8B0000); }
  .bar.you { height: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); }
  .bar-label {
    font-size: 20px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .bar-label.red { color: rgba(255,45,45,0.7); }
  .bar-label.dim { color: rgba(255,255,255,0.25); }

  .vs {
    font-family: 'Bebas Neue', cursive;
    font-size: 40px; color: rgba(255,255,255,0.1);
    margin-bottom: 28px; align-self: center;
  }

  .divider {
    width: 60px; height: 3px;
    background: #FF2D2D;
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: 96px; line-height: 0.9;
    letter-spacing: 0.02em; color: #fff;
    margin-bottom: 28px;
  }
  h1 .red { color: #FF2D2D; }

  .sub {
    font-size: 28px; font-weight: 400;
    color: rgba(255,255,255,0.4);
    line-height: 1.65; max-width: 580px;
    margin-bottom: auto;
  }
  .sub strong { color: rgba(255,255,255,0.8); font-weight: 600; }

  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 40px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .brand {
    font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.25); text-transform: uppercase;
  }
  .brand span { color: #FF2D2D; }
  .url {
    font-size: 22px; font-weight: 600;
    color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 24px; border-radius: 100px;
  }
</style>
</head>
<body>
<div class="noise"></div>
<div class="slash"></div>
<div class="slash-text">VADODARA</div>

<div class="wrap">
  <div class="tag">The Math Doesn't Lie</div>

  <div style="display:flex; align-items:flex-end; gap:20px; margin-bottom:52px;">
    <div class="bar-group">
      <div class="bar-val red">10</div>
      <div class="bar competitor"></div>
      <div class="bar-label red">Competitor</div>
      <div style="font-size:18px;color:rgba(255,45,45,0.5);font-weight:600;letter-spacing:0.06em;">enquiries/week</div>
    </div>

    <div class="vs">VS</div>

    <div class="bar-group">
      <div class="bar-val dim">0</div>
      <div class="bar you"></div>
      <div class="bar-label dim">You</div>
      <div style="font-size:18px;color:rgba(255,255,255,0.2);font-weight:600;letter-spacing:0.06em;">from Google</div>
    </div>

    <!-- SVG arrow + label -->
    <div style="margin-left:40px; margin-bottom:20px;">
      <svg width="260" height="180" viewBox="0 0 260 180" fill="none">
        <!-- Same city label -->
        <rect x="0" y="0" width="240" height="44" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="120" y="17" font-family="Inter" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700" letter-spacing="2">SAME CITY</text>
        <text x="120" y="33" font-family="Inter" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700" letter-spacing="2">SAME SERVICE</text>

        <rect x="0" y="52" width="240" height="44" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="120" y="69" font-family="Inter" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700" letter-spacing="2">SAME PRICE</text>
        <text x="120" y="85" font-family="Inter" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700" letter-spacing="2">SAME QUALITY</text>

        <rect x="0" y="104" width="240" height="50" rx="8" fill="rgba(255,45,45,0.08)" stroke="rgba(255,45,45,0.2)" stroke-width="1"/>
        <text x="120" y="124" font-family="Inter" font-size="11" fill="rgba(255,45,45,0.8)" text-anchor="middle" font-weight="700" letter-spacing="2">ONE DIFFERENCE</text>
        <text x="120" y="142" font-family="Inter" font-size="13" fill="#FF2D2D" text-anchor="middle" font-weight="800" letter-spacing="1">THEY SHOWED UP.</text>
      </svg>
    </div>
  </div>

  <div class="divider"></div>

  <h1>Fix it.<br/><span class="red">One call.</span></h1>

  <p class="sub">Website + SEO for local businesses in Vadodara.<br/><strong>Results from Month 2. No fluff.</strong></p>

  <div class="bottom">
    <div class="brand"><span>Scalify</span> Vadodara</div>
    <div class="url">scalifyapp.com/vadodara</div>
  </div>
</div>
</body>
</html>
